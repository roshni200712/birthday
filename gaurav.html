<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Happy Birthday GUDDI 🎂</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial,Helvetica,sans-serif;
    overflow:hidden;
    background:linear-gradient(-45deg,#ff6b81,#ff9a9e,#fbc2eb,#a18cd1);
    background-size:400% 400%;
    animation:bg 10s ease infinite;
}

@keyframes bg{
0%{background-position:0% 50%;}
50%{background-position:100% 50%;}
100%{background-position:0% 50%;}
}

.container{
    width:100%;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:20px;
}

.card{
    background:rgba(255,255,255,.15);
    backdrop-filter:blur(12px);
    border-radius:20px;
    padding:30px;
    text-align:center;
    color:#fff;
    width:100%;
    max-width:420px;
    box-shadow:0 15px 35px rgba(0,0,0,.25);
    animation:pop 1s;
}

@keyframes pop{
from{
transform:scale(.6);
opacity:0;
}
to{
transform:scale(1);
opacity:1;
}
}

h1{
font-size:38px;
margin-bottom:20px;
animation:bounce 2s infinite;
}

@keyframes bounce{
0%,100%{transform:translateY(0);}
50%{transform:translateY(-10px);}
}

p{
font-size:18px;
line-height:1.7;
margin-bottom:25px;
}

button{
background:#ff4081;
color:white;
border:none;
padding:14px 28px;
font-size:18px;
border-radius:50px;
cursor:pointer;
transition:.3s;
}

button:hover{
background:#ff1f6d;
transform:scale(1.05);
}

.balloon{
position:absolute;
bottom:-150px;
width:60px;
height:80px;
border-radius:50%;
animation:float linear infinite;
}

.balloon:after{
content:"";
position:absolute;
width:2px;
height:70px;
background:white;
left:50%;
top:80px;
}

@keyframes float{
0%{
transform:translateY(0);
}
100%{
transform:translateY(-120vh);
}
}

.confetti{
position:absolute;
width:10px;
height:16px;
top:-20px;
animation:fall linear forwards;
}

@keyframes fall{
to{
transform:translateY(110vh) rotate(720deg);
}
}

@media(max-width:600px){

h1{
font-size:30px;
}

p{
font-size:16px;
}

button{
width:100%;
}

}
</style>

</head>

<body>

<div class="container">

<div class="card">

<h1>🎉 Happy Birthday GUDDI! 🎂</h1>

<p>
Happy birthday, little bro! ❤️<br><br>

You're not so little anymore,
but you'll always be that annoying kid I love. 😄

Hope your day is filled with laughter,
fun, cake, gifts, and unforgettable memories.
Have an amazing birthday! 🎁🎈🎂
</p>

<button onclick="celebrate()">
🎊 Celebrate 🎉
</button>

</div>

</div>

<script>

const colors=[
"#ff4d6d",
"#ffd60a",
"#3a86ff",
"#06d6a0",
"#8338ec",
"#ff006e"
];

// Balloons

for(let i=0;i<15;i++){

let b=document.createElement("div");

b.className="balloon";

b.style.left=Math.random()*100+"vw";

b.style.background=colors[Math.floor(Math.random()*colors.length)];

b.style.animationDuration=(8+Math.random()*5)+"s";

b.style.animationDelay=Math.random()*5+"s";

document.body.appendChild(b);

}

// Confetti

function confetti(){

for(let i=0;i<180;i++){

let c=document.createElement("div");

c.className="confetti";

c.style.left=Math.random()*100+"vw";

c.style.background=colors[Math.floor(Math.random()*colors.length)];

c.style.animationDuration=(2+Math.random()*3)+"s";

document.body.appendChild(c);

setTimeout(()=>{
c.remove();
},5000);

}

}

function celebrate(){

confetti();

alert("🎉 Happy Birthday GUDDI! 🎂");

}

setInterval(confetti,5000);

window.onload=confetti;

</script>

</body>
</html>
